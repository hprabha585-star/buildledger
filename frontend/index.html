<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>BuildLedger</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── DESIGN TOKENS ── */
:root{
  --bg:#0d0f14;--s1:#141720;--s2:#1c2030;--s3:#252b3b;
  --acc:#f5a623;--grn:#2dce89;--red:#f5365c;--blu:#5e72e4;
  --txt:#e8eaf0;--mut:#6b7394;--bd:#252b3b;
  --fb:'DM Sans',sans-serif;--fm:'JetBrains Mono',monospace;
  --r:12px;
  /* fluid nav height — taller on big phones */
  --nav:clamp(56px,8vh,70px);
  --safe:env(safe-area-inset-bottom,0px);
  /* fluid spacing */
  --sp:clamp(12px,4vw,18px);
  /* fluid font base */
  --f-base:clamp(13px,3.8vw,16px);
  --f-sm:clamp(11px,3.2vw,13px);
  --f-lg:clamp(15px,4.2vw,18px);
  --f-xl:clamp(17px,4.8vw,22px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:var(--f-base);overscroll-behavior:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{display:none}

/* ── AUTH ── */
.auth-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--sp);background:radial-gradient(ellipse at 30% 40%,rgba(245,166,35,.1),transparent 55%),var(--bg)}
.auth-card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:clamp(20px,6vw,36px) clamp(16px,5vw,28px);width:100%;max-width:420px}
.auth-logo{font-size:var(--f-xl);font-weight:700;color:var(--acc);margin-bottom:4px}
.auth-sub{font-size:var(--f-sm);color:var(--mut);margin-bottom:clamp(18px,5vw,28px)}
.auth-tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:20px;gap:4px}
.auth-tab{flex:1;padding:clamp(9px,2.5vw,12px);font-size:var(--f-base);font-weight:500;border-radius:8px;border:none;background:none;color:var(--mut);cursor:pointer;transition:all .2s;font-family:var(--fb)}
.auth-tab.active{background:var(--acc);color:#000;font-weight:700}

/* ── FORMS ── */
.fg{margin-bottom:clamp(10px,3vw,16px)}
.fl{font-size:var(--f-sm);font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;display:block}
.fi,.fs,.fta{width:100%;background:var(--s2);border:1.5px solid var(--bd);border-radius:var(--r);padding:clamp(12px,3.5vw,15px);color:var(--txt);font-family:var(--fb);font-size:var(--f-base);outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none}
.fi:focus,.fs:focus,.fta:focus{border-color:var(--acc)}
.fi::placeholder{color:var(--mut)}
.fs{cursor:pointer}
.fta{resize:none;min-height:80px}
/* On small screens (<360px) stack the 2-col form row */
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:359px){.frow{grid-template-columns:1fr}}
.err{background:rgba(245,54,92,.1);border:1px solid rgba(245,54,92,.3);color:var(--red);padding:12px;border-radius:10px;font-size:var(--f-sm);margin-top:10px}

/* ── BUTTONS ── */
.btn{padding:clamp(11px,3vw,14px) clamp(14px,4vw,22px);border-radius:var(--r);font-family:var(--fb);font-size:var(--f-base);font-weight:600;cursor:pointer;border:none;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;-webkit-appearance:none;touch-action:manipulation;min-height:clamp(44px,12vw,52px)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-p{background:var(--acc);color:#000}
.btn-sm{padding:clamp(8px,2.5vw,11px) clamp(12px,3.5vw,18px);font-size:var(--f-sm);min-height:clamp(38px,10vw,44px)}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:8px;min-height:30px}
.btn-o{background:transparent;border:1.5px solid var(--bd);color:var(--txt)}
.btn-d{background:rgba(245,54,92,.12);color:var(--red);border:1.5px solid rgba(245,54,92,.25)}
.btn-g{background:rgba(45,206,137,.12);color:var(--grn);border:1.5px solid rgba(45,206,137,.25)}
.btn-b{background:rgba(94,114,228,.12);color:var(--blu);border:1.5px solid rgba(94,114,228,.25)}
.btn-full{width:100%;justify-content:center}
.mact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mact .btn{flex:1;justify-content:center;min-width:80px}

/* ── APP SHELL ── */
.app{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{flex-shrink:0;background:linear-gradient(180deg,var(--s1),rgba(20,23,32,.96));border-bottom:1px solid var(--bd);padding:0 var(--sp);height:clamp(52px,14vw,62px);display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.25);position:relative;z-index:10}
.tb-left{flex:1;min-width:0}
.tb-title{font-size:var(--f-lg);font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:var(--f-sm);color:var(--mut);margin-top:1px;font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-avatar{width:clamp(34px,9vw,42px);height:clamp(34px,9vw,42px);border-radius:50%;background:linear-gradient(145deg,var(--acc),#d98c0f);color:#000;font-weight:700;font-size:clamp(13px,3.5vw,16px);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 0 0 2px rgba(245,166,35,.18),0 2px 8px rgba(245,166,35,.3);transition:transform .15s}
.tb-avatar:active{transform:scale(.93)}
.page-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(var(--nav) + var(--safe) + 10px)}
.bottom-nav{flex-shrink:0;position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(20,23,32,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);height:calc(var(--nav) + var(--safe));padding-bottom:var(--safe);display:flex;box-shadow:0 -2px 12px rgba(0,0,0,.3)}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--mut);font-family:var(--fb);font-size:clamp(9px,2.5vw,11px);font-weight:600;padding:4px 2px;touch-action:manipulation;transition:color .15s,transform .15s;position:relative}
.bnav-item.active{color:var(--acc)}
.bnav-item.active::before{content:'';position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:20px;height:2.5px;border-radius:2px;background:var(--acc)}
.bnav-item:active{transform:scale(.92)}
.bnav-ico{font-size:clamp(19px,5.5vw,24px);line-height:1}

/* ── DRAWER / BOTTOM SHEET ── */
.dov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;animation:fadein .15s}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-radius:20px 20px 0 0;z-index:310;padding:12px 0 calc(20px + var(--safe));animation:slideup .2s ease}
.d-handle{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:0 auto 16px}
.d-item{display:flex;align-items:center;gap:14px;padding:clamp(14px,4vw,18px) var(--sp);font-size:var(--f-base);font-weight:500;cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--txt);font-family:var(--fb)}
.d-item:active{background:var(--s2)}
.d-ico{font-size:clamp(18px,5vw,22px);width:28px;text-align:center}
.d-divider{height:1px;background:var(--bd);margin:8px 16px}
.sov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;animation:fadein .15s}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--s1);border-radius:20px 20px 0 0;z-index:410;max-height:93vh;max-height:93dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe));animation:slideup .22s ease}
.sh{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:12px auto 0}
.shd{display:flex;align-items:center;justify-content:space-between;padding:16px var(--sp) 0}
.sht{font-size:var(--f-lg);font-weight:600}
.shc{background:var(--s2);border:none;width:32px;height:32px;border-radius:50%;color:var(--mut);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.shb{padding:14px var(--sp)}

/* ── PAGE LAYOUT ── */
.pp{padding:var(--sp)}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap}
.stitle{font-size:var(--f-sm);font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mut)}

/* ── CARDS ── */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:var(--sp);margin-bottom:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ct{font-size:var(--f-base);font-weight:600}

/* ── STAT GRID ── */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.sc{background:var(--s2);border-radius:14px;padding:clamp(10px,3vw,16px);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.04)}
.sc::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.sc.or::before{background:var(--acc)}.sc.gn::before{background:var(--grn)}.sc.rd::before{background:var(--red)}.sc.bl::before{background:var(--blu)}
.sc .si{font-size:clamp(16px,4.5vw,20px);margin-bottom:6px;display:block;width:auto;background:none;border:none;padding:0}
.sv{font-family:var(--fm);font-size:clamp(14px,4.5vw,20px);font-weight:700;line-height:1.2;word-break:break-word}
.sv.or{color:var(--acc)}.sv.gn{color:var(--grn)}.sv.rd{color:var(--red)}.sv.bl{color:var(--blu)}
.slb{font-size:clamp(10px,2.8vw,12px);color:var(--mut);margin-top:4px;font-weight:500}
.ssb{font-size:clamp(9px,2.5vw,11px);color:var(--mut);margin-top:2px;opacity:.8}
.stat{background:var(--s2);border-radius:14px;padding:clamp(10px,3vw,14px)}
.s-ico{font-size:clamp(16px,4.5vw,20px);margin-bottom:6px}
.s-val{font-family:var(--fm);font-size:clamp(16px,4.5vw,20px);font-weight:600;line-height:1}
.s-lbl{font-size:clamp(9px,2.5vw,11px);color:var(--mut);margin-top:4px}

/* ── BADGE ── */
.badge{padding:3px clamp(6px,2vw,10px);border-radius:20px;font-size:clamp(10px,2.8vw,12px);font-weight:600;display:inline-block;white-space:nowrap}
.bg-g{background:rgba(45,206,137,.15);color:var(--grn)}
.bg-r{background:rgba(245,54,92,.15);color:var(--red)}
.bg-o{background:rgba(245,166,35,.15);color:var(--acc)}
.bg-b{background:rgba(94,114,228,.15);color:var(--blu)}
.bg-gr{background:rgba(107,115,148,.15);color:var(--mut)}

/* ── LIST ROW ── */
.lrow{display:flex;align-items:center;padding:clamp(12px,3.5vw,15px) var(--sp);gap:12px;border-bottom:1px solid rgba(255,255,255,.05);background:var(--s1);cursor:pointer}
.lrow:last-child{border-bottom:none}
.lrow:active{background:var(--s2)}
.lav{width:clamp(40px,11vw,48px);height:clamp(40px,11vw,48px);border-radius:50%;background:var(--acc);color:#000;font-weight:700;font-size:clamp(14px,4vw,18px);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.lav img{width:100%;height:100%;object-fit:cover}
.li{flex:1;min-width:0}
.ln{font-size:var(--f-base);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ls{font-size:var(--f-sm);color:var(--mut);margin-top:2px}

/* ── LEDGER ROWS ── */
.ldr{display:flex;align-items:center;padding:12px 0;gap:10px;border-bottom:1px solid rgba(255,255,255,.05)}
.ldr:last-child{border-bottom:none}
.ld{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ld.in{background:rgba(45,206,137,.12)}.ld.out{background:rgba(245,54,92,.12)}
.la{font-family:var(--fm);font-size:clamp(12px,3.5vw,14px);font-weight:500;flex-shrink:0}
.la.in{color:var(--grn)}.la.out{color:var(--red)}

/* ── BOTTOM SHEET ATTENDANCE ── */
.arow{display:flex;align-items:center;padding:12px var(--sp);gap:10px;background:var(--s1);border-bottom:1px solid rgba(255,255,255,.05)}
.arow.pr{border-left:3px solid var(--grn)}.arow.hr{border-left:3px solid var(--acc)}.arow.ar{border-left:3px solid transparent}
.aav{width:clamp(48px,13vw,60px);height:clamp(48px,13vw,60px);border-radius:50%;background:var(--acc);color:#000;font-weight:700;font-size:clamp(17px,4.5vw,22px);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.aav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.ainf{flex:1;min-width:0}
.anm{font-size:clamp(14px,4vw,17px);font-weight:700;line-height:1.3}
.amt{font-size:clamp(11px,3.2vw,13px);color:var(--mut);margin-top:3px}

/* ── P/½/A BUTTONS ── */
.pha-w{display:flex;gap:clamp(4px,1.5vw,8px);flex-shrink:0}
.pha{padding:clamp(9px,2.5vw,12px) clamp(12px,3.5vw,18px);border-radius:10px;font-size:clamp(14px,4vw,17px);font-weight:700;cursor:pointer;border:2px solid;background:transparent;touch-action:manipulation;min-width:clamp(42px,12vw,52px);min-height:clamp(42px,12vw,52px);display:flex;align-items:center;justify-content:center}
.pha:active{transform:scale(.92)}
.pha.pp{border-color:var(--grn);color:var(--grn)}.pha.pp.sel{background:var(--grn);color:#000}
.pha.hh{border-color:var(--acc);color:var(--acc)}.pha.hh.sel{background:var(--acc);color:#000}
.pha.aa{border-color:var(--red);color:var(--red)}.pha.aa.sel{background:var(--red);color:#fff}
.wtl{font-size:clamp(11px,3.2vw,13px);color:var(--mut);font-weight:500}
.tog{width:clamp(44px,12vw,52px);height:clamp(24px,6.5vw,28px);border-radius:14px;border:none;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;touch-action:manipulation}
.tog.on{background:var(--grn)}.tog.off{background:var(--bd)}
.tog::after{content:'';position:absolute;width:clamp(18px,5vw,22px);height:clamp(18px,5vw,22px);border-radius:50%;background:#fff;top:clamp(3px,.8vw,4px);transition:left .2s}
.tog.on::after{left:calc(100% - clamp(18px,5vw,22px) - clamp(3px,.8vw,4px))}.tog.off::after{left:clamp(3px,.8vw,4px)}
.wc{font-family:var(--fm);font-size:clamp(12px,3.5vw,14px);min-width:clamp(52px,14vw,68px);text-align:right;flex-shrink:0;font-weight:600}
.wc.e{color:var(--acc)}.wc.p{color:var(--grn)}.wc.z{color:var(--mut)}

/* ── SITE PICKER ── */
.spw{position:relative;display:inline-block}
.schip,.site-chip{font-size:clamp(10px,2.8vw,13px);padding:clamp(4px,1.2vw,6px) clamp(8px,2.5vw,12px);border-radius:7px;background:rgba(94,114,228,.1);color:var(--blu);border:1px solid rgba(94,114,228,.2);cursor:pointer;display:inline-block;margin-top:4px;white-space:nowrap}
.spdd{position:absolute;top:calc(100% + 4px);left:0;background:var(--s2);border:1px solid var(--bd);border-radius:10px;z-index:50;min-width:160px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.spdd button{display:block;width:100%;text-align:left;padding:11px 12px;font-size:var(--f-base);background:none;border:none;color:var(--txt);cursor:pointer;border-radius:6px;font-family:var(--fb)}
.spdd button:active{background:var(--s3)}

/* ── DATE BAR ── */
.dbar{background:var(--s2);border-radius:14px;padding:12px var(--sp);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dnav{display:flex;align-items:center;gap:8px}
.dnav button{background:var(--s3);border:none;color:var(--txt);width:clamp(32px,9vw,38px);height:clamp(32px,9vw,38px);border-radius:8px;cursor:pointer;font-size:clamp(16px,4.5vw,20px);display:flex;align-items:center;justify-content:center;touch-action:manipulation}

/* ── ATTENDANCE ROW (vertical card) ── */
.att-row{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:clamp(12px,3.5vw,16px);display:flex;flex-direction:column;gap:10px}
.p-row{border-left:4px solid var(--grn)}.h-row{border-left:4px solid var(--acc)}.a-row{border-left:4px solid var(--bd)}
.att-top{display:flex;align-items:flex-start;gap:clamp(8px,3vw,14px)}
.att-info{flex:1;min-width:0}
.att-bot{display:flex;align-items:center;gap:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06)}
.att-bot .pha-w{display:flex;gap:clamp(4px,1.5vw,8px);flex-shrink:0}
.att-bot-spacer{flex:1}
.wage-toggle{display:flex;align-items:center;gap:6px;flex-shrink:0}
.mini-ca{display:flex;gap:6px;flex-shrink:0}
.mini-ca a{text-decoration:none;font-size:clamp(18px,5vw,24px);display:flex;align-items:center;justify-content:center;width:clamp(40px,11vw,48px);height:clamp(40px,11vw,48px);border-radius:12px;background:var(--s2);border:1px solid var(--bd)}

/* ── MISC UI ── */
.prog,.progress-bar{height:5px;background:var(--bd);border-radius:3px;overflow:hidden;margin-top:6px}
.pf,.progress-fill{height:100%;border-radius:3px;transition:width .4s}
.tabs{display:flex;background:var(--s2);border-radius:10px;padding:3px;margin-bottom:14px;gap:3px}
.tab{flex:1;text-align:center;padding:clamp(8px,2.5vw,11px) 4px;font-size:var(--f-sm);font-weight:500;border-radius:8px;cursor:pointer;color:var(--mut);border:none;background:none;font-family:var(--fb)}
.tab.active{background:var(--acc);color:#000;font-weight:700}
.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--acc);font-size:var(--f-base);font-weight:600;cursor:pointer;padding:0;font-family:var(--fb)}
.ib{background:rgba(94,114,228,.07);border:1px solid rgba(94,114,228,.18);border-radius:10px;padding:10px var(--sp);font-size:var(--f-sm);color:var(--mut);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.sc2{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:var(--sp);margin-bottom:12px}
.sc2:active{border-color:var(--acc)}
.prow{display:flex;align-items:center;padding:12px 0;gap:10px;border-bottom:1px solid rgba(255,255,255,.05)}
.prow:last-child{border-bottom:none}
.pico{width:36px;height:36px;border-radius:10px;background:rgba(45,206,137,.1);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.pnm{font-size:var(--f-base);font-weight:500}.pdt{font-size:var(--f-sm);color:var(--mut);margin-top:2px}
.pamt{font-family:var(--fm);font-size:clamp(14px,4vw,16px);font-weight:600;color:var(--grn);flex-shrink:0}
.pdel{background:none;border:none;color:var(--mut);cursor:pointer;font-size:18px;padding:6px;flex-shrink:0}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb2{background:var(--s2);border:1.5px solid var(--bd);border-radius:12px;padding:clamp(12px,3.5vw,16px);cursor:pointer;text-align:left;color:var(--txt);font-family:var(--fb);width:100%}
.tb2:active{border-color:var(--acc)}

<script>
const {useState,useEffect,useCallback,useRef,createContext,useContext}=React;
const API=window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1'
  ?'http://localhost:5000/api'
  :window.location.origin+'/api';
const TODAY=new Date().toISOString().split('T')[0];
const monthStart=()=>TODAY.slice(0,7)+'-01';
function forceLogout(){
  localStorage.removeItem('bl_token');
  localStorage.removeItem('bl_user');
  if(!location.pathname.endsWith('/login'))window.location.reload();
}
async function apiFetch(path,opts={}){
  const token=localStorage.getItem('bl_token');
  const res=await fetch(API+path,{headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})}, ...opts});
  if(res.status===401){forceLogout();throw new Error('Session expired — please sign in again');}
  const d=await res.json();if(!res.ok)throw new Error(d.error||'Request failed');return d;
}
async function apiForm(path,fd,method='POST'){
  const token=localStorage.getItem('bl_token');
  const res=await fetch(API+path,{method,headers:{...(token?{Authorization:`Bearer ${token}`}:{})},body:fd});
  if(res.status===401){forceLogout();throw new Error('Session expired — please sign in again');}
  const d=await res.json();if(!res.ok)throw new Error(d.error||'Request failed');return d;
}
const fmt=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtDs=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):'—';

const tel=n=>n?`tel:${n}`:'#';
const E=React.createElement;
const ToastCtx=createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const show=useCallback((msg,type='success')=>{const id=Date.now();setToasts(t=>[...t,{id,msg,type}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3200);},[]);
  return E(ToastCtx.Provider,{value:show},children,E('div',{className:'tw'},toasts.map(t=>E('div',{key:t.id,className:`toast ${t.type}`},t.type==='success'?'✅':'❌',t.msg))));
}
const useToast=()=>useContext(ToastCtx);

function AuthScreen({onLogin}){
  const [tab,setTab]=useState('login');
  const [f,setF]=useState({name:'',email:'',password:'',companyName:''});
  const [loading,setLoading]=useState(false);const [err,setErr]=useState('');
  const toast=useToast();const set=k=>ev=>setF(x=>({...x,[k]:ev.target.value}));
  const submit=async()=>{setErr('');setLoading(true);try{const d=await apiFetch(`/auth/${tab}`,{method:'POST',body:JSON.stringify(f)});localStorage.setItem('bl_token',d.token);localStorage.setItem('bl_user',JSON.stringify(d.user));toast('Welcome, '+d.user.name+'!');onLogin(d.user);}catch(e){setErr(e.message);}setLoading(false);};
  const kp=ev=>ev.key==='Enter'&&submit();
  return E('div',{className:'auth-wrap'},E('div',{className:'auth-card'},
    E('div',{className:'auth-logo'},'🏗️ BUILDLEDGER'),E('div',{className:'auth-sub'},'Construction Management Platform'),
    E('div',{className:'auth-tabs'},['login','register'].map(t=>E('button',{key:t,className:`auth-tab ${tab===t?'active':''}`,onClick:()=>{setTab(t);setErr('');}},t==='login'?'Sign In':'Register'))),
    tab==='register'&&E('div',{className:'fg'},E('label',{className:'fl'},'Your Name'),E('input',{className:'fi',placeholder:'Ramesh Kumar',value:f.name,onChange:set('name'),onKeyPress:kp})),
    tab==='register'&&E('div',{className:'fg'},E('label',{className:'fl'},'Company Name'),E('input',{className:'fi',placeholder:'RK Constructions',value:f.companyName,onChange:set('companyName'),onKeyPress:kp})),
    E('div',{className:'fg'},E('label',{className:'fl'},'Email'),E('input',{className:'fi',type:'email',placeholder:'you@example.com',value:f.email,onChange:set('email'),onKeyPress:kp})),
    E('div',{className:'fg'},E('label',{className:'fl'},'Password'),E('input',{className:'fi',type:'password',placeholder:'••••••••',value:f.password,onChange:set('password'),onKeyPress:kp})),
    err&&E('div',{className:'err'},err),
    E('button',{className:'btn btn-p btn-full',style:{marginTop:'18px'},onClick:submit,disabled:loading},loading?'Loading…':tab==='login'?'Sign In':'Create Account')
  ));
}
const NAV=[{sec:'Overview',items:[{id:'dashboard',ico:'📊',lbl:'Dashboard'}]},{sec:'Workforce',items:[{id:'workers',ico:'👷',lbl:'Workers'},{id:'attendance',ico:'📋',lbl:'Attendance'}]},{sec:'Projects',items:[{id:'sites',ico:'🏗️',lbl:'Sites'},{id:'owners',ico:'👤',lbl:'Owners'}]},{sec:'Finance',items:[{id:'payments',ico:'💰',lbl:'Payments'},{id:'expenses',ico:'💸',lbl:'Expenses'}]}];
function Sidebar({page,setPage,user,onLogout}){
  return E('div',{className:'sidebar'},
    E('div',{className:'sb-logo'},E('div',{className:'logo-txt'},'🏗️ BUILD'),E('div',{className:'logo-co'},user.companyName||'Ledger')),

  );

function PhotoPicker({photo,onChange}){
  const [cam,setCam]=useState(false);
  const [facing,setFacing]=useState('environment');
  const [switching,setSwitching]=useState(false);
  const vRef=useRef(null);const fRef=useRef(null);
  // Use a ref for the stream so stopTracks is always synchronous and never stale
  const streamRef=useRef(null);

  const stopTracks=()=>{
    try{ streamRef.current?.getTracks().forEach(t=>t.stop()); }catch{}
    streamRef.current=null;
  };

  const openStream=async(mode)=>{
    setSwitching(true);
    stopTracks(); // synchronously kill existing stream before requesting new one
    let s=null;
    // First try exact facing mode (works best on Android Chrome)
    try{ s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:mode}}}); }
    catch{
      // Fall back to ideal (works on iOS Safari and desktops with one camera)
      try{ s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:mode}}}); }
      catch{
        // Last resort: any camera
        try{ s=await navigator.mediaDevices.getUserMedia({video:true}); }
        catch{ setSwitching(false); alert('Camera blocked — please allow camera access in browser settings and try again'); return; }
      }
    }
    streamRef.current=s;
    setFacing(mode);
    setCam(true);
    setSwitching(false);
    // Attach stream to video element — must happen after setCam re-renders the <video>
    requestAnimationFrame(()=>{ if(vRef.current){ vRef.current.srcObject=s; vRef.current.play().catch(()=>{}); } });
  };

  const startCam=()=>openStream(facing);
  const switchCam=()=>openStream(facing==='environment'?'user':'environment');
  const stopCam=()=>{ stopTracks(); setCam(false); };
  // Release camera when modal closes / component unmounts
  useEffect(()=>()=>stopTracks(),[]);

  const capture=()=>{
    const v=vRef.current,c=document.createElement('canvas');
    c.width=v.videoWidth||320;c.height=v.videoHeight||240;
    const ctx=c.getContext('2d');
    // Un-mirror front camera so saved photo faces correctly
    if(facing==='user'){ ctx.translate(c.width,0); ctx.scale(-1,1); }
    ctx.drawImage(v,0,0);
    onChange(c.toDataURL('image/jpeg',.85));
    stopCam();
  };
  const pickFile=ev=>{const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=e=>onChange(e.target.result);r.readAsDataURL(file);};

  return E('div',{className:'pw'},cam
    ? E('div',{className:'cw'},
        E('video',{ref:vRef,autoPlay:true,playsInline:true,muted:true,style:{transform:facing==='user'?'scaleX(-1)':undefined,width:'100%',display:'block'}}),
        E('div',{className:'co'},
          E('button',{className:'btn btn-p',onClick:capture,disabled:switching},'📸 Capture'),
          E('button',{className:'btn btn-o',onClick:switchCam,disabled:switching},switching?'Switching…':'🔄 '+(facing==='environment'?'Front cam':'Back cam')),
          E('button',{className:'btn btn-d',onClick:stopCam},'✕ Cancel')
        )
      )
    : E(React.Fragment,null,
        E('div',{className:'pp-photo',onClick:()=>fRef.current?.click()},photo?E('img',{src:photo,alt:'w',style:{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}):E('span',{style:{fontSize:'36px'}},'👷')),
        E('div',{className:'pb'},
          E('button',{className:'btn btn-o',onClick:()=>fRef.current?.click()},'📁 Upload Photo'),
          E('button',{className:'btn btn-o',onClick:startCam},'📷 Take Photo')
        ),
        E('input',{ref:fRef,type:'file',accept:'image/*',style:{display:'none'},onChange:pickFile})
      )
  );
}
function Dashboard({setPage}){
  const [data,setData]=useState(null);const [loading,setLoading]=useState(true);

  return E('div',null,

        E('div',{className:'sc gn'},E('div',{className:'si'},'📈'),E('div',{className:'sv gn'},fmt(t.netProfit)),E('div',{className:'slb'},'Net Profit'),E('div',{className:'ssb'},'Expenses: '+fmt(t.totalExpenses))),
        E('div',{className:'sc bl'},E('div',{className:'si'},'👷'),E('div',{className:'sv bl'},ta.present),E('div',{className:'slb'},'Today Present'),E('div',{className:'ssb'},'of '+t.workers+' workers'))
      ),

      E('div',{className:'card',style:{marginBottom:'16px',border:upGroups.length>0?'1px solid rgba(245,54,92,.3)':undefined}},
        E('div',{className:'ch'},
          E('div',{style:{flex:1}},
            E('div',{className:'ct'},'⏳ Unpaid Wages'+(upGroups.length>0?' ('+upGroups.length+' workers)':'')),
            upGroups.length>0&&E('div',{style:{fontSize:'12px',color:'var(--red)',marginTop:'3px',fontFamily:'var(--fm)'}},fmt(totalUnpaidAmt)+' total owed')
          ),
          E('button',{className:'btn btn-o btn-sm',onClick:()=>setPage('attendance')},'Attendance')

        E('button',{className:'d-item',onClick:()=>{setDrawer(false);if(confirm('Logout?'))logout();}},E('span',{className:'d-ico'},'⏏'),E('span',{style:{color:'var(--red)'}},'Logout'))
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(E(App));
</script></body></html>
